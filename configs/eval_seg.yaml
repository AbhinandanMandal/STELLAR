defaults:
  - model/downstream@model: segmentation
  - datamodule: ade20k_datamodule #segmentation_datamodule # ade20k_datamodule #
  - trainer: stellar_trainer
  - evaluator: segmentation_evaluator
  - loss: segmentation_loss
  - optimizer: adamw
  - olympus_checkpoint: stellar_checkpoint_loader
  - _self_

# Definitions sub-configs rely on. These will only work if running from amlt, override
# on command line otherwise
mounts:
  external: ${oc.env:EXTERNAL,external}
  output: ${oc.env:OUTPUT,outputs}
project_name: stellar
experiment_name: ${oc.env:AMLT_EXPERIMENT_NAME,local}
job_name: ${oc.env:AMLT_JOB_NAME,eval_seg}
experiment_output_dir: ${mounts.output}/${project_name}/${job_name}

datamodule:
  split_train_validate: True
  validate_split_ratio: 0.1
  dataloaders:
    train:
      batch_size: 2048
    test:
      batch_size: 2048

optimizer:
  lr: 0.0001

model:
  num_classes: 150
  freeze_model: False
  freeze_backbone: True
  _target_: src.models.downstream.segmentation.SegmentationProbing
  feature_key: dense
  feature_dim: 768
  is_baseline: False
  model_backbone:
    _target_: load_stellar.load_stellar
    model: stellar-b16
    revision: 6794be9a20fb9d3944c5bcc6003512a347fa518f

olympus_checkpoint:
  load_checkpoint: False
  loader: null

trainer:
  max_epochs: 80
  enable_checkpointing: False  # Disable automatic checkpointing to save disk space

evaluator:
  use_probe: False
  classifier_type: knn    # knn, logreg
  feature_key: dense

mode: "train"