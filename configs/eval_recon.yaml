defaults:
  - model/downstream@model: reconstruction
  - datamodule: imagenet_datamodule
  - trainer: stellar_trainer
  - evaluator: stellar_evaluator
  - loss: stellar_loss
  - optimizer: adamw
  - olympus_checkpoint: stellar_checkpoint_loader
  - _self_

# Definitions sub-configs rely on. These will only work if running from amlt, override
# on command line otherwise
mounts:
  external: ${oc.env:EXTERNAL,external}
  output: ${oc.env:OUTPUT,outputs}
project_name: stellar
experiment_name: ${oc.env:AMLT_EXPERIMENT_NAME,local}
job_name: ${oc.env:AMLT_JOB_NAME,eval_recon}
experiment_output_dir: ${mounts.output}/${project_name}/${job_name}

datamodule:
  dataloaders:
    train:
      batch_size: 128
    validate:
      batch_size: 128
    test:
      batch_size: 128
optimizer:
  lr: 0.0001
 
model:
  freeze_model: True
  feature_key: lowrank
  feature_dim: 768
  is_baseline: False
  vq_model: "${mounts.external}/PretrainedModels/vqgan/maskgit/maskgit-vqgan-imagenet-f16-256.bin"
  model:
    _target_: load_stellar.load_stellar
    model: stellar-b16
    revision: 6794be9a20fb9d3944c5bcc6003512a347fa518f
  model_checkpoint: null

olympus_checkpoint:
  load_checkpoint: False
  loader: null
 
trainer:
  max_epochs: 20
  enable_checkpointing: True  # Disable automatic checkpointing to save disk space
  
mode: "train"
